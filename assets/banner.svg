<svg width="1600" height="440" viewBox="0 0 1600 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Ahmed Grabus — Software Engineer</title>
  <defs>
    <radialGradient id="sjaj1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1260 90) rotate(90) scale(520 720)">
      <stop stop-color="#7c3aed" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sjaj2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 460) rotate(90) scale(360 620)">
      <stop stop-color="#4c1d95" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ime" x1="90" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="linija" x1="90" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="okvir" x1="930" y1="80" x2="1510" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="mreza" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="blijedi" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(800 180) rotate(90) scale(420 900)">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="maska">
      <rect width="1600" height="440" fill="url(#blijedi)"/>
    </mask>
  </defs>

  <rect width="1600" height="440" rx="24" fill="#07050b"/>
  <rect width="1600" height="440" rx="24" fill="url(#sjaj1)"/>
  <rect width="1600" height="440" rx="24" fill="url(#sjaj2)"/>
  <rect width="1600" height="440" fill="url(#mreza)" mask="url(#maska)"/>

  <!-- Lijeva strana -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect x="90" y="86" width="296" height="36" rx="18" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-opacity="0.35"/>
    <circle cx="112" cy="104" r="5" fill="#a78bfa">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="126" y="110" font-size="15" font-weight="600" letter-spacing="2" fill="#c4b5fd">SOFTWARE ENGINEER @ ZIRA</text>

    <text x="86" y="222" font-size="86" font-weight="700" letter-spacing="-2" fill="url(#ime)">Ahmed Grabus</text>
    <text x="92" y="278" font-size="25" fill="#b8b1c9">Full-stack · .NET · Angular · Flutter · Next.js</text>

    <rect x="92" y="312" width="470" height="2" fill="url(#linija)"/>

    <text x="92" y="358" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" fill="#6f6684">Bosnia and Herzegovina · github.com/grabator</text>
  </g>

  <!-- Terminal -->
  <g font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace">
    <rect x="930" y="80" width="580" height="280" rx="18" fill="#0d0916" fill-opacity="0.92"/>
    <rect x="930.5" y="80.5" width="579" height="279" rx="17.5" stroke="url(#okvir)"/>
    <path d="M930 124H1510" stroke="#8b5cf6" stroke-opacity="0.18"/>
    <circle cx="958" cy="102" r="6" fill="#8b5cf6" fill-opacity="0.9"/>
    <circle cx="980" cy="102" r="6" fill="#8b5cf6" fill-opacity="0.45"/>
    <circle cx="1002" cy="102" r="6" fill="#8b5cf6" fill-opacity="0.2"/>
    <text x="1220" y="107" font-size="14" fill="#6f6684" text-anchor="middle">~/grabator</text>

    <text x="962" y="170" font-size="20"><tspan fill="#8b5cf6">$</tspan><tspan fill="#ece8f5"> whoami</tspan></text>
    <text x="962" y="204" font-size="20" fill="#9d93b3">ahmed grabus — software engineer</text>

    <text x="962" y="252" font-size="20"><tspan fill="#8b5cf6">$</tspan><tspan fill="#ece8f5"> cat focus.txt</tspan></text>
    <text x="962" y="286" font-size="20" fill="#9d93b3">clean architecture · performance · ux</text>

    <text x="962" y="334" font-size="20" fill="#8b5cf6">$</text>
    <rect x="982" y="318" width="11" height="21" rx="1.5" fill="#a78bfa">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
