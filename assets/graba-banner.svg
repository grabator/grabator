<svg width="1600" height="420" viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="whiteGradient" x1="0" x2="1">
    <stop offset="0%" stop-color="#ffffff"></stop>
    <stop offset="100%" stop-color="#666666"></stop>
</linearGradient>

<pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
    <path d="M45 0H0V45" fill="none" stroke="#1c1c1c" stroke-width="1"></path>
</pattern>

<filter id="blur">
    <feGaussianBlur stdDeviation="14"></feGaussianBlur>
</filter>

</defs>


<!-- Background -->

<rect width="1600" height="420" fill="#050505"></rect>

<rect width="1600" height="420" fill="url(#grid)" opacity="0.35"></rect>


<!-- Soft futuristic glow -->

<circle cx="1180" cy="190" r="220" fill="#ffffff" opacity="0.025" filter="url(#blur)"></circle>


<!-- Main Identity -->

<text x="100" y="135" font-family="JetBrains Mono, Consolas, monospace" font-size="62" font-weight="700" fill="#ffffff">
Ahmed Grabus
</text>


<text x="105" y="190" font-family="JetBrains Mono, Consolas, monospace" font-size="28" fill="#aaaaaa">
Full Stack Software Engineer
</text>


<text x="105" y="245" font-family="JetBrains Mono, Consolas, monospace" font-size="22" fill="#777777">
&gt; building modern software systems_
</text>


<!-- Technologies -->

<text x="105" y="300" font-family="JetBrains Mono, Consolas, monospace" font-size="20" fill="#ffffff">
JavaScript • TypeScript • C# • C++
</text>


<text x="105" y="335" font-family="JetBrains Mono, Consolas, monospace" font-size="20" fill="#999999">
Angular • Java • Flutter
</text>


<!-- Bottom line -->

<line x1="105" y1="370" x2="720" y2="370" stroke="url(#whiteGradient)" stroke-width="2"></line>



<!-- GRABA META BRAND -->

<text x="920" y="225" font-family="Arial, Helvetica, sans-serif" font-size="115" font-weight="900" letter-spacing="10" fill="#ffffff" opacity="0.045">
GRABA
</text>


<!-- Meta Frame -->

<path d="
M970 90
H1390
L1470 180
L1390 270
H970
L890 180
Z" fill="none" stroke="#252525" stroke-width="2"></path>


<path d="
M1030 125
H1340
L1400 180
L1340 235
H1030
L970 180
Z" fill="none" stroke="#333333" stroke-width="2"></path>



<!-- Center Core -->

<circle cx="1185" cy="180" r="9" fill="#ffffff" opacity="0.75"></circle>


<circle cx="1185" cy="180" r="34" stroke="#444444" stroke-width="2" fill="none"></circle>


<line x1="1185" y1="90" x2="1185" y2="125" stroke="#444444"></line>


<line x1="1185" y1="235" x2="1185" y2="270" stroke="#444444"></line>



<!-- Signature -->

<text x="1080" y="340" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#555555">
{ code / create / innovate }
</text>


</svg>